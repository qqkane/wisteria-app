plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "org.wisteria.app"
    compileSdk 35

    defaultConfig {
        applicationId "org.wisteria.app"
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName "1.0.0"
    }

    // WisteriaBridge.VERSION reads BuildConfig.VERSION_NAME so the version
    // the settings screen shows can never disagree with the APK again (it
    // stayed "0.4.2" for three releases).
    buildFeatures {
        buildConfig true
    }

    // Release signing: the permanent keystore (restored from CI secrets)
    // when present and its password is exported, else the debug key so
    // local and secret-less CI builds keep assembling. The permanent key is
    // what makes release APKs update over each other — a per-run debug key
    // produced a new signature every build.
    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
        }
        release {
            def relKs = new File("${System.properties['user.home']}/.android/release.keystore")
            def relPass = System.getenv("WISTERIA_KEYSTORE_PASSWORD") ?: ""
            if (relKs.exists() && !relPass.isEmpty()) {
                storeFile relKs
                storePassword relPass
                keyAlias "wisteria"
                keyPassword relPass
            } else {
                storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    // The gomobile-bound wisteria engine (built by CI from the protocol repo).
    implementation fileTree(dir: "libs", include: ["*.aar"])
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
