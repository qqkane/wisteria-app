<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#43307a"/>
      <stop offset="55%" stop-color="#2a1d52"/>
      <stop offset="100%" stop-color="#150e2b"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="108" height="108" rx="26" fill="url(#bg)"/>
  <g>
    <!-- stem -->
    <path d="M54 20 C54 26 54 29 54 33" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" fill="none"/>
