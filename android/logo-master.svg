    <!-- raceme: hanging cluster of lilac petals, light to deep -->
    <circle cx="43" cy="42" r="7" fill="#e9d5ff" stroke="#241740" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="54" cy="40.5" r="7" fill="#e9d5ff" stroke="#241740" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="65" cy="42" r="7" fill="#e9d5ff" stroke="#241740" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="48" cy="53.5" r="6.6" fill="#c4b5fd" stroke="#241740" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="60" cy="53.5" r="6.6" fill="#c4b5fd" stroke="#241740" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="54" cy="64" r="6.5" fill="#a78bfa" stroke="#241740" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="54" cy="73.5" r="4.5" fill="#8b5cf6"/>
    <!-- gloss highlights -->
    <circle cx="41" cy="39.5" r="2" fill="#ffffff" opacity="0.55"/>
    <circle cx="52" cy="38" r="2" fill="#ffffff" opacity="0.55"/>
    <circle cx="63" cy="39.5" r="2" fill="#ffffff" opacity="0.55"/>
