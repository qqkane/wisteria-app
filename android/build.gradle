// Top-level build file. AGP 8.7 needs Gradle 8.9+ (CI pins 8.9 via
// gradle/actions/setup-gradle) and is the first line with compileSdk 35 /
// targetSdk 35 support.
plugins {
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}
