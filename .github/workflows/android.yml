name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # The Go engine lives in the private protocol repo; the AAR is built
      # from its checkout, never committed to this repo. The same bind
      # carries the embedded sing-box core (BoxStart facade) — a mobile app
      # can host exactly one gomobile runtime, so both protocol families
      # ship in this single AAR.
      # TODO: switch to the default branch once wisteria PR #13 (mobile/)
      # is merged — the engine package only exists on feature/android-engine.
      - name: Checkout wisteria protocol repo
        uses: actions/checkout@v4
        with:
          repository: qqkane/wisteria
          ref: feature/android-engine
          token: ${{ secrets.WISTERIA_TOKEN }}
          path: wisteria

      - uses: actions/setup-go@v5
        with:
          go-version-file: wisteria/go.mod
          cache-dependency-path: wisteria/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # assembleRelease signs with the debug keystore; the runner has none.
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: gomobile bind
        working-directory: wisteria
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          # Diagnostics: the package-load phase runs cgo for GOOS=android.
          go version
          (which clang && clang --version | head -1) || echo "no system clang"
          GOOS=android GOARCH=arm CGO_ENABLED=1 go list -e -compiled=true \
            -f 'LOAD{{if .Error}}-ERR[{{.Error.Err}}]{{end}} {{.ImportPath}} compiled={{len .CompiledGoFiles}}' ./mobile
          # gomobile bind requires golang.org/x/mobile in the module graph.
          # CI-only: the checkout's go.mod is never committed back.
          go get golang.org/x/mobile@latest
          # A system clang can't target android, which leaves the bound
          # package with zero compiled files ("no exported names"). Put a
          # shim in front of PATH that redirects plain clang at the NDK
          # one with an android target, so every cgo invocation during
          # the load phases (gomobile's and gobind's) succeeds.
          PREBUILT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SHIM="$(mktemp -d)"
          printf '#!/bin/sh\nexec "%s/clang" --target=armv7a-linux-androideabi24 "$@"\n' "$PREBUILT" > "$SHIM/clang"
          chmod +x "$SHIM/clang"
          export PATH="$SHIM:$PATH"
          # gomobile does not create the -o directory itself.
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          # -checklinkname=0: sing-box uses //go:linkname, which the Go
          # linker refuses by default since 1.23.
          # -tags: sing-box compiles its protocol support behind feature
          # tags; without them every hysteria2/tuic outbound dies with
          # "QUIC is not included in this build" and every uTLS/REALITY
          # vless/vmess/trojan with "uTLS is not included" (the phone logs
          # proved exactly that). This is the same tag set SFA ships,
          # minus the server-only reality_server and clash_api.
          gomobile bind -target=android -androidapi 24 -javapkg=org.wisteria \
            -ldflags='-checklinkname=0 -s -w' \
            -tags='with_conntrack,with_quic,with_dhcp,with_wireguard,with_utls,with_gvisor' \
            -o "$GITHUB_WORKSPACE/android/app/libs/wisteria.aar" ./mobile

      - name: Build APKs
        run: gradle -p android --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Wisteria-android-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/Wisteria-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wisteria-android
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Wisteria-android.apk
