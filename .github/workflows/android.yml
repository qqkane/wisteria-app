name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # The Go engine lives in the private protocol repo; the AAR is built
      # from its checkout, never committed to this repo. The same bind
      # carries the embedded sing-box core (BoxStart facade) — a mobile app
      # can host exactly one gomobile runtime, so both protocol families
      # ship in this single AAR. Built from main since wisteria PR #13
      # (mobile/) merged.
      - name: Checkout wisteria protocol repo
        uses: actions/checkout@v4
        with:
          repository: qqkane/wisteria
          ref: main
          token: ${{ secrets.WISTERIA_TOKEN }}
          path: wisteria

      - uses: actions/setup-go@v5
        with:
          go-version-file: wisteria/go.mod
          cache-dependency-path: wisteria/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Install gomobile
        run: |
          # Pinned: @latest once shipped an incompatible release mid-day and
          # the bind broke with no change in this repo. Bump deliberately.
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The release APK must always carry the same signature, or no update
      # ever installs over a previous release. WISTERIA_RELEASE_KEYSTORE_B64
      # (base64 of a PKCS12 keystore, alias "wisteria") and
      # WISTERIA_KEYSTORE_PASSWORD are repo secrets; without them the build
      # falls back to a per-run debug key so CI stays green.
      - name: Keystores
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.WISTERIA_RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > ~/.android/release.keystore
            echo "release keystore restored from secrets"
          else
            echo "WISTERIA_RELEASE_KEYSTORE_B64 not set - release APK falls back to the debug key"
          fi
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: gomobile bind
        working-directory: wisteria
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          # Diagnostics: the package-load phase runs cgo for GOOS=android.
          go version
          (which clang && clang --version | head -1) || echo "no system clang"
          GOOS=android GOARCH=arm CGO_ENABLED=1 go list -e -compiled=true \
            -f 'LOAD{{if .Error}}-ERR[{{.Error.Err}}]{{end}} {{.ImportPath}} compiled={{len .CompiledGoFiles}}' ./mobile
          # gomobile bind requires golang.org/x/mobile in the module graph.
          # CI-only: the checkout's go.mod is never committed back. Pinned to
          # the same version as the installed gomobile above.
          go get golang.org/x/mobile@v0.0.0-20261011034528-197770444867
          # A system clang can't target android, which leaves the bound
          # package with zero compiled files ("no exported names"). Put a
          # shim in front of PATH that redirects plain clang at the NDK
          # one with an android target, so every cgo invocation during
          # the load phases (gomobile's and gobind's) succeeds.
          PREBUILT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SHIM="$(mktemp -d)"
          printf '#!/bin/sh\nexec "%s/clang" --target=armv7a-linux-androideabi24 "$@"\n' "$PREBUILT" > "$SHIM/clang"
          chmod +x "$SHIM/clang"
          export PATH="$SHIM:$PATH"
          # gomobile does not create the -o directory itself.
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          # The embedded sing-box version must match the module the bind
          # compiles, not a hand-maintained ldflags constant.
          SBVER=$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)
          SBVER=${SBVER#v}
          # -checklinkname=0: sing-box uses //go:linkname, which the Go
          # linker refuses by default since 1.23.
          # -tags: sing-box compiles its protocol support behind feature
          # tags; without them every hysteria2/tuic outbound dies with
          # "QUIC is not included in this build" and every uTLS/REALITY
          # vless/vmess/trojan with "uTLS is not included" (the phone logs
          # proved exactly that). This is the same tag set SFA ships,
          # minus the server-only reality_server and clash_api.
          # arm64 + arm only: the x86 ABIs exist for emulators and doubled
          # the AAR (a 186 MB APK); every real device is one of the two.
          gomobile bind -target=android/arm64,android/arm -androidapi 24 -javapkg=org.wisteria \
            -ldflags="-checklinkname=0 -s -w -X github.com/sagernet/sing-box/constant.Version=${SBVER}" \
            -tags='with_conntrack,with_quic,with_dhcp,with_wireguard,with_utls,with_gvisor' \
            -o "$GITHUB_WORKSPACE/android/app/libs/wisteria.aar" ./mobile

      - name: Build APKs
        env:
          WISTERIA_KEYSTORE_PASSWORD: ${{ secrets.WISTERIA_KEYSTORE_PASSWORD }}
        run: gradle -p android --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Wisteria-android-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/Wisteria-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wisteria-android
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Wisteria-android.apk
