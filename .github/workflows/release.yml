name: release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/release.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: build windows bundle
    runs-on: windows-latest
    # Build jobs are read-only: the write permission is for the release
    # publish job only, so a pull_request run never gets a writable token.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The wisteria core sources (wisteria-client) live in the protocol
      # repo; the bundle ships the built core next to the shell.
      - name: checkout wisteria protocol repo
        uses: actions/checkout@v4
        with:
          repository: qqkane/wisteria
          ref: v0.9.10
          token: ${{ secrets.WISTERIA_TOKEN }}
          path: wisteria

      - uses: actions/setup-go@v5
        with:
          go-version-file: wisteria/go.mod
          cache-dependency-path: wisteria/go.sum

      # go resolves the main module from the current directory, so the
      # core build must run inside the protocol repo checkout.
      - name: build wisteria cores
        working-directory: wisteria
        run: |
          go build -trimpath -ldflags "-w -s -X github.com/qqkane/wisteria/internal/version.Version=v0.9.10" -o ../desktop/build/bin/wisteria-client.exe ./cmd/wisteria-client
          go build -trimpath -ldflags "-w -s -X github.com/qqkane/wisteria/internal/version.Version=v0.9.10" -o ../desktop/build/bin/wisteria-server.exe ./cmd/wisteria-server

      # The GUI shell (nested module; static frontend, no Node needed).
      - name: build desktop shell
        working-directory: desktop
        run: |
          go vet ./...
          go test ./...
          go build -tags desktop,production -ldflags "-w -s -H windowsgui" -o build/WisteriaDesktop.exe .

      # Full-tunnel e2e with the real cores.
      - name: service e2e
        working-directory: desktop
        env:
          WIST_E2E: "1"
          WIST_CLIENT: ${{ github.workspace }}/desktop/build/bin/wisteria-client.exe
          WIST_SERVER: ${{ github.workspace }}/desktop/build/bin/wisteria-server.exe
        run: go test ./internal/core/ -run TestServiceE2E -v

      - name: package
        working-directory: desktop
        run: |
          mkdir -p dist/WisteriaDesktop
          cp build/WisteriaDesktop.exe dist/WisteriaDesktop/
          cp build/bin/wisteria-client.exe dist/WisteriaDesktop/bin/ 2>/dev/null || (mkdir -p dist/WisteriaDesktop/bin && cp build/bin/wisteria-client.exe dist/WisteriaDesktop/bin/)
          cp README.md dist/WisteriaDesktop/
          cd dist
          7z a ../WisteriaDesktop-windows-amd64.zip WisteriaDesktop
          sha256sum ../WisteriaDesktop-windows-amd64.zip > ../WisteriaDesktop-windows-amd64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WisteriaDesktop-windows-amd64
          path: |
            desktop/WisteriaDesktop-windows-amd64.zip
            desktop/WisteriaDesktop-windows-amd64.zip.sha256

  # The Linux bundle: GTK3 + WebKit2GTK (the Wails runtime needs CGO here),
  # native cores and the full service e2e. Built on 24.04 with the
  # webkit2_41 tag so the shell links against WebKit2GTK 4.1 — modern
  # distros (24.04, Arch, Fedora) dropped the 4.0 ABI entirely, and a
  # 4.0-linked binary fails to start there with a missing
  # libwebkit2gtk-4.0.so.37 error.
  linux:
    name: build linux bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: checkout wisteria protocol repo
        uses: actions/checkout@v4
        with:
          repository: qqkane/wisteria
          ref: v0.9.10
          token: ${{ secrets.WISTERIA_TOKEN }}
          path: wisteria

      - uses: actions/setup-go@v5
        with:
          go-version-file: wisteria/go.mod
          cache-dependency-path: wisteria/go.sum

      - name: install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libnss3-dev

      - name: build wisteria cores
        working-directory: wisteria
        run: |
          go build -trimpath -ldflags "-w -s -X github.com/qqkane/wisteria/internal/version.Version=v0.9.10" -o ../desktop/build/bin/wisteria-client ./cmd/wisteria-client
          go build -trimpath -ldflags "-w -s -X github.com/qqkane/wisteria/internal/version.Version=v0.9.10" -o ../desktop/build/bin/wisteria-server ./cmd/wisteria-server

      - name: vet and test
        working-directory: desktop
        run: |
          go vet ./...
          go test -race ./...

      - name: service e2e
        working-directory: desktop
        env:
          WIST_E2E: "1"
          WIST_CLIENT: ${{ github.workspace }}/desktop/build/bin/wisteria-client
          WIST_SERVER: ${{ github.workspace }}/desktop/build/bin/wisteria-server
        run: go test ./internal/core/ -run TestServiceE2E -v

      - name: build desktop shell
        working-directory: desktop
        run: CGO_ENABLED=1 go build -tags desktop,production,webkit2_41 -ldflags "-w -s" -o build/WisteriaDesktop .

      - name: package
        working-directory: desktop
        run: |
          mkdir -p dist/WisteriaDesktop/bin
          cp build/WisteriaDesktop dist/WisteriaDesktop/
          cp build/bin/wisteria-client dist/WisteriaDesktop/bin/
          cp README.md dist/WisteriaDesktop/
          tar -czf WisteriaDesktop-linux-amd64.tar.gz -C dist WisteriaDesktop
          sha256sum WisteriaDesktop-linux-amd64.tar.gz > WisteriaDesktop-linux-amd64.tar.gz.sha256

      # AppImage (thin): the shell + wisteria core + desktop integration;
      # GTK3/WebKit2GTK come from the host, same requirement as the tar.gz.
      # Bundling WebKit2GTK is not portable — its child processes
      # (WebKitNetworkProcess etc.) are looked up at the build host's
      # hardcoded /usr/lib/.../webkit2gtk-4.1 path, which crashes at
      # startup on any distro with a different layout (Arch, Fedora).
      - name: package appimage
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin/bin
          cp build/WisteriaDesktop AppDir/usr/bin/
          cp build/bin/wisteria-client AppDir/usr/bin/bin/

          # appimagetool expects the desktop file and icon at the AppDir root
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Wisteria Desktop' \
            'Comment=Wisteria VPN client' \
            'Exec=WisteriaDesktop' \
            'Icon=WisteriaDesktop' \
            'Categories=Network;' \
            'Terminal=false' \
            > AppDir/WisteriaDesktop.desktop
          cp frontend/dist/assets/icon.png AppDir/WisteriaDesktop.png

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -e' \
            'self="$(readlink -f "$0")"' \
            'appdir="$(dirname "$self")"' \
            'exec "$appdir/usr/bin/WisteriaDesktop" "$@"' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun

          ./appimagetool AppDir WisteriaDesktop-linux-x86_64.AppImage
          sha256sum WisteriaDesktop-linux-x86_64.AppImage > WisteriaDesktop-linux-x86_64.AppImage.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WisteriaDesktop-linux-amd64
          path: |
            desktop/WisteriaDesktop-linux-amd64.tar.gz
            desktop/WisteriaDesktop-linux-amd64.tar.gz.sha256
            desktop/WisteriaDesktop-linux-x86_64.AppImage
            desktop/WisteriaDesktop-linux-x86_64.AppImage.sha256

  # One release per v* tag with every platform bundle; the self-updater
  # reads releases/latest from this repo and picks its platform's asset.
  release:
    name: publish release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WisteriaDesktop-windows-amd64/*
            dist/WisteriaDesktop-linux-amd64/*
